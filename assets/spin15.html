<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Jukebox Card Art Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Courier+Prime:wght@400;700&family=Fjalla+One&family=Impact&family=Oswald:wght@500;700&family=Righteous&family=Pacifico&family=Lobster&family=Fascinate&family=Limelight&family=Poiret+One&family=Yellowtail&family=Satisfy&family=Permanent+Marker&family=Shrikhand&family=Monoton&family=Bungee&family=Rampart+One&family=Cinzel:wght@700&family=Playfair+Display:wght@900&family=Abril+Fatface&family=Rubik+Mono+One&family=Bangers&family=Arimo:wght@400;700&family=Damion&family=Cookie&family=Leckerli+One&family=Erica+One&family=Fugaz+One&family=Ultra&family=Vampiro+One&family=Chicle&family=Corben&family=Russo+One&family=Fascinate+Inline&family=Special+Elite&family=Space+Mono&family=Sigmar+One&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #0f172a; /* Slate 900 */
            color: #f8fafc;
        }
        
        #card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            padding: 1.5rem;
            justify-items: center;
        }
        
        canvas {
            border-radius: 4px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
            transform: scale(1);
            transition: transform 0.2s;
            background-color: #000;
        }
        
        canvas:hover {
            transform: scale(1.05) translateY(-5px);
            z-index: 10;
            position: relative;
        }

</head>
<body class="min-h-screen flex flex-col font-sans">

    <header class="bg-slate-800 border-b border-slate-700 p-6 shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-pink-500 to-cyan-400 tracking-tight">
                    Jukebox Card Art Library
                </h1>
                <p class="text-slate-400 text-sm mt-1">Psychedelic Waves, Warhol Stacks, UFOs & Retro Microphones.</p>
            </div>
            
            <div class="flex gap-3">
                <button id="btn-generate-50" class="px-5 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg transition-colors shadow-sm font-medium border border-slate-600">
                    Regenerate 50
                </button>
                <button id="btn-add-20" class="px-5 py-2 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white rounded-lg transition-colors shadow-sm font-medium">
                    + Add 20 Cards
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow w-full max-w-[1600px] mx-auto">
        <div id="card-grid"></div>
    </main>

    <script>
        function xmur3(str) {
            let h = 1779033703 ^ str.length;
            for (let i = 0; i < str.length; i++) {
                h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
                h = (h << 13) | (h >>> 19);
            }
            return () => {
                h = Math.imul(h ^ (h >>> 16), 2246822507);
                h = Math.imul(h ^ (h >>> 13), 3266489909);
                return ((h ^= h >>> 16) >>> 0);
            };
        }

        function getContrast(hex) {
            if (!hex || hex[0] !== '#') return '#000000';
            const r = parseInt(hex.substr(1, 2), 16);
            const g = parseInt(hex.substr(3, 2), 16);
            const b = parseInt(hex.substr(5, 2), 16);
            return (r * 299 + g * 587 + b * 114) / 1000 >= 128 ? '#000000' : '#ffffff';
        }

        function getWcagLuminance(r, g, b) {
            const a = [r, g, b].map(function (v) {
                v /= 255;
                return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
            });
            return a[0] * 0.2126 + a[1] * 0.7152 + a[2] * 0.0722;
        }

        const palettes = [
            ['#e63946', '#f1faee', '#1d3557', '#a8dadc'], ['#ffb703', '#fb8500', '#023047', '#8ecae6'],
            ['#ef476f', '#ffd166', '#06d6a0', '#073b4c'], ['#ffffff', '#000000', '#dddddd', '#ff0000'],
            ['#f4a261', '#e76f51', '#2a9d8f', '#264653'], ['#8ecae6', '#219ebc', '#023047', '#ffb703'],
            ['#d9ed92', '#b5e48c', '#34a0a4', '#1a759f'], ['#2b2d42', '#8d99ae', '#edf2f4', '#d90429'],
            ['#000000', '#14213d', '#fca311', '#e5e5e5'], ['#3d5a80', '#98c1d9', '#e0fbfc', '#ee6c4d'],
            ['#ff9f1c', '#ffbf69', '#ffffff', '#cbf3f0'], ['#f72585', '#7209b7', '#3a0ca3', '#4cc9f0'],
            ['#dad7cd', '#a3b18a', '#588157', '#344e41'], ['#fec5bb', '#fcd5ce', '#fae1dd', '#f8edeb'],
            ['#000000', '#d4af37', '#ffffff', '#111111'], ['#ff00ff', '#00ffff', '#000000', '#ffff00'],
            ['#f4e285', '#f4a259', '#5b8e7d', '#bc4b51'], ['#2a0800', '#f4d03f', '#e74c3c', '#ffffff'],
            ['#fdf6e3', '#eee8d5', '#073642', '#cb4b16'], ['#4a4e69', '#9a8c98', '#c9ada7', '#f2e9e4'],
            ['#ff595e', '#ffca3a', '#8ac926', '#1982c4'], ['#1d3557', '#457b9d', '#a8dadc', '#e63946'],
            ['#283618', '#606c38', '#fefae0', '#dda15e'], ['#5f0f40', '#9a031e', '#fb8b24', '#e36414'],
            ['#0b132b', '#1c2541', '#3a506b', '#5bc0be'], ['#335c67', '#fff3b0', '#e09f3e', '#9e2a2b'],
            ['#003049', '#d62828', '#f77f00', '#fcbf49'], ['#22223b', '#4a4e69', '#9a8c98', '#c9ada7'],
            ['#0d3b66', '#faf0ca', '#f4d35e', '#ee964b'], ['#f94144', '#f3722c', '#f8961e', '#f9c74f'],
            ['#5d5c61', '#379683', '#7395ae', '#557a95'], ['#1a1a1d', '#4e4e50', '#6f2232', '#950740'],
            ['#c0c0c0', '#ffffff', '#808080', '#000000'], ['#ffe066', '#247ba0', '#70c1b3', '#50514f'],
            ['#6b2d5c', '#f0386b', '#ff5376', '#f8c0c8'],
        ];

        const displayFonts = ["'Anton'", "'Bebas Neue'", "'Monoton'", "'Righteous'", "'Fjalla One'", "'Limelight'", "'Rampart One'", "'Rubik Mono One'", "'Abril Fatface'", "'Bungee'", "'Bangers'", "'Erica One'", "'Fugaz One'", "'Ultra'", "'Vampiro One'", "'Chicle'", "'Russo One'", "'Sigmar One'", "'Fascinate Inline'"];
        const scriptFonts = ["'Pacifico'", "'Lobster'", "'Yellowtail'", "'Satisfy'", "'Shrikhand'", "'Permanent Marker'", "'Fascinate'", "'Damion'", "'Cookie'", "'Leckerli One'"];
        const codeFonts = ["'Rubik Mono One'", "'Courier Prime'", "'Oswald'", "'Space Mono'", "'Special Elite'"];
        const infoFonts = ["'Courier Prime'", "'Oswald'", "'Cinzel'", "'Playfair Display'", "'Poiret One'", "'Arimo'", "'Corben'", "'Space Mono'", "'Special Elite'"];

        function generateCardArt(song) {
            const seedStr = song.titleA + song.artist + song.code;
            const seedGen = xmur3(seedStr);
            const rnd = () => (seedGen() >>> 0) / 4294967296;
            const rndInt = (max) => Math.floor(rnd() * max);

            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 100;
            const ctx = canvas.getContext('2d', { willReadFrequently: true });

            const textCanvas = document.createElement('canvas');
            textCanvas.width = 256; textCanvas.height = 100;
            const textCtx = textCanvas.getContext('2d', { willReadFrequently: true });

            // Expanding limits to include the newest 9 concepts
            const bgStyle = rndInt(46); 
            const decorStyle = rndInt(46); 
            const borderStyle = rndInt(15);
            const layoutStyle = rndInt(47); 
            
            const fDisp = displayFonts[rndInt(displayFonts.length)];
            const fScrpt = scriptFonts[rndInt(scriptFonts.length)];
            const fCode = codeFonts[rndInt(codeFonts.length)];
            const fInfo = infoFonts[rndInt(infoFonts.length)];

            const pal = palettes[rndInt(palettes.length)];
            const bg1 = pal[0]; const bg2 = pal[1]; const acc1 = pal[2]; const acc2 = pal[3];
            let tc1 = getContrast(bg1);

            const drawAdvText = (targetCtx, text, x, y, font, color, align, scaleX = 1, scaleY = 1, rot = 0, shadowOverride = 1) => {
                targetCtx.save(); 
                
                // Allow dynamic shadow toggling for complex layouts
                let sl = shadowOverride;
                if (sl === false) sl = 1;
                if (sl === true) sl = 2;
                
                if (sl > 0) { 
                    targetCtx.shadowColor = getContrast(color) === '#000000' ? 'rgba(0,0,0,0.85)' : 'rgba(255,255,255,0.85)';
                    targetCtx.shadowOffsetX = sl === 1 ? 1.5 : 3; 
                    targetCtx.shadowOffsetY = sl === 1 ? 1.5 : 3; 
                    targetCtx.shadowBlur = 0; 
                }
                
                targetCtx.fillStyle = color;
                targetCtx.font = font; targetCtx.textAlign = align; targetCtx.textBaseline = 'middle';
                targetCtx.translate(x, y); targetCtx.rotate(rot); targetCtx.scale(scaleX, scaleY); targetCtx.fillText(text, 0, 0, 240 / scaleX); 
                targetCtx.restore();
            };

            const drawIcon = (targetCtx, type, cx, cy, size, color) => {
                targetCtx.save();
                targetCtx.fillStyle = color;
                targetCtx.beginPath();
                if (type === 0) { for (let i = 0; i < 10; i++) { const r = (i % 2 === 0) ? size : size / 2; const a = (i / 10) * Math.PI * 2 - Math.PI / 2; targetCtx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); } }
                else if (type === 1) { targetCtx.arc(cx - size / 4, cy + size / 4, size / 4, 0, Math.PI * 2); targetCtx.fill(); targetCtx.beginPath(); targetCtx.fillRect(cx, cy - size / 2, size / 6, size * 0.8); targetCtx.moveTo(cx, cy - size / 2); targetCtx.quadraticCurveTo(cx + size / 2, cy - size / 4, cx + size / 2, cy + size / 4); targetCtx.lineTo(cx + size / 3, cy + size / 4); targetCtx.quadraticCurveTo(cx + size / 3, cy - size / 4, cx, cy - size / 4); }
                else if (type === 2) { targetCtx.moveTo(cx + size / 4, cy - size / 2); targetCtx.lineTo(cx - size / 2, cy + size / 8); targetCtx.lineTo(cx - size / 8, cy + size / 8); targetCtx.lineTo(cx - size / 4, cy + size / 2); targetCtx.lineTo(cx + size / 2, cy - size / 8); targetCtx.lineTo(cx + size / 8, cy - size / 8); }
                else if (type === 3) { targetCtx.moveTo(cx, cy - size / 2); targetCtx.lineTo(cx + size / 2, cy); targetCtx.lineTo(cx, cy + size / 2); targetCtx.lineTo(cx - size / 2, cy); }
                else if (type === 4) { targetCtx.arc(cx, cy, size / 2, 0, Math.PI * 2); targetCtx.fill(); targetCtx.fillStyle = getContrast(color); targetCtx.beginPath(); targetCtx.arc(cx, cy, size / 6, 0, Math.PI * 2); }
                else if (type === 5) { targetCtx.translate(cx, cy); targetCtx.strokeStyle = color; targetCtx.lineWidth = 2; for (let i = 0; i < 3; i++) { targetCtx.rotate(Math.PI / 3); targetCtx.beginPath(); targetCtx.ellipse(0, 0, size, size / 3, 0, 0, Math.PI * 2); targetCtx.stroke(); } targetCtx.fillStyle = getContrast(bg1); targetCtx.beginPath(); targetCtx.arc(0, 0, size / 5, 0, Math.PI * 2); targetCtx.fill(); }
                else if (type === 6) { targetCtx.moveTo(cx - size, cy + size / 2); targetCtx.lineTo(cx - size, cy - size / 2); targetCtx.lineTo(cx - size / 2, cy); targetCtx.lineTo(cx, cy - size); targetCtx.lineTo(cx + size / 2, cy); targetCtx.lineTo(cx + size, cy - size / 2); targetCtx.lineTo(cx + size, cy + size / 2); }
                else if (type === 7) { targetCtx.moveTo(cx - size, cy + size); targetCtx.quadraticCurveTo(cx, cy, cx + size, cy - size); targetCtx.quadraticCurveTo(cx + size / 2, cy + size / 2, cx - size, cy + size); }
                else if (type === 8) { targetCtx.moveTo(cx, cy - size / 2); targetCtx.bezierCurveTo(cx + size / 3, cy - size / 2, cx + size / 2, cy - size / 4, cx + size / 2, cy); targetCtx.lineTo(cx + size / 2.5, cy + size / 6); targetCtx.lineTo(cx + size / 2, cy + size / 3); targetCtx.lineTo(cx + size / 2, cy + size / 2); targetCtx.lineTo(cx - size / 2, cy + size / 2); targetCtx.lineTo(cx - size / 2, cy - size / 2); }
                else if (type === 9) { for (let i = 0; i < 16; i++) { const r = (i % 2 === 0) ? size : size * 0.7; const a = (i / 16) * Math.PI * 2; targetCtx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); } }
                targetCtx.fill();
                targetCtx.restore();
            };

            // ==========================================
            // LAYER 1: BACKGROUNDS
            // ==========================================
            ctx.fillStyle = bg1; ctx.fillRect(0, 0, 256, 100); ctx.fillStyle = bg2;
            
            if (bgStyle === 1) { ctx.fillRect(0, 50, 256, 50); }
            else if (bgStyle === 2) { ctx.fillRect(128, 0, 128, 100); }
            else if (bgStyle === 3) { ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(256, 0); ctx.lineTo(256, 100); ctx.fill(); }
            else if (bgStyle === 4) { for (let i = 0; i < 100; i += 25) ctx.fillRect(0, i, 256, 12.5); }
            else if (bgStyle === 5) { for (let ix = 0; ix < 256; ix += 20) for (let iy = 0; iy < 100; iy += 20) if ((ix / 20 + iy / 20) % 2 === 0) ctx.fillRect(ix, iy, 20, 20); }
            else if (bgStyle === 6) { for (let ix = 15; ix < 256; ix += 30) for (let iy = 15; iy < 100; iy += 30) { ctx.beginPath(); ctx.arc(ix, iy, 6, 0, Math.PI * 2); ctx.fill(); } }
            else if (bgStyle === 7) { ctx.beginPath(); for (let i = 0; i < 24; i++) { ctx.moveTo(128, 50); ctx.lineTo(128 + Math.cos(i * Math.PI / 12) * 200, 50 + Math.sin(i * Math.PI / 12) * 200); ctx.lineTo(128 + Math.cos((i + 0.5) * Math.PI / 12) * 200, 50 + Math.sin((i + 0.5) * Math.PI / 12) * 200); } ctx.fill(); }
            else if (bgStyle === 8) { ctx.fillRect(0, 0, 85, 100); ctx.fillStyle = acc1; ctx.fillRect(171, 0, 85, 100); }
            else if (bgStyle === 9) { ctx.beginPath(); ctx.moveTo(0, 100); ctx.lineTo(0, 50); for (let i = 0; i <= 256; i += 10) ctx.lineTo(i, 50 + Math.sin(i / 20) * 15); ctx.lineTo(256, 100); ctx.fill(); }
            else if (bgStyle === 10) { ctx.beginPath(); for (let i = 0; i < 36; i++) { ctx.moveTo(128, 50); ctx.lineTo(128 + Math.cos(i * Math.PI / 18) * 200, 50 + Math.sin(i * Math.PI / 18) * 200); ctx.lineTo(128 + Math.cos((i + 0.5) * Math.PI / 18) * 200, 50 + Math.sin((i + 0.5) * Math.PI / 18) * 200); } ctx.fill(); }
            else if (bgStyle === 11) { ctx.lineWidth = 10; ctx.strokeStyle = bg2; for (let i = 10; i < 200; i += 25) { ctx.beginPath(); ctx.moveTo(128, 50 - i); ctx.lineTo(128 + i, 50); ctx.lineTo(128, 50 + i); ctx.lineTo(128 - i, 50); ctx.closePath(); ctx.stroke(); } }
            else if (bgStyle === 12) { ctx.fillStyle = bg2; ctx.fillRect(0, 20, 256, 20); ctx.fillStyle = acc1; ctx.fillRect(0, 60, 256, 20); }
            else if (bgStyle === 13) { ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(128, 0); ctx.lineTo(0, 100); ctx.fill(); ctx.fillStyle = acc1; ctx.beginPath(); ctx.moveTo(256, 100); ctx.lineTo(128, 100); ctx.lineTo(256, 0); ctx.fill(); }
            else if (bgStyle === 14) { for (let ix = 10; ix < 256; ix += 15) for (let iy = 10; iy < 100; iy += 15) { ctx.beginPath(); ctx.arc(ix, iy, (ix / 256) * 6, 0, Math.PI * 2); ctx.fill(); } }
            else if (bgStyle === 15) { ctx.fillStyle = bg2; ctx.fillRect(0, 30, 256, 40); }
            else if (bgStyle === 16) { ctx.fillStyle = acc1; ctx.fillRect(0, 0, 60, 100); ctx.fillStyle = bg2; ctx.fillRect(60, 0, 196, 100); }
            else if (bgStyle === 17) { ctx.beginPath(); ctx.moveTo(0, 50); ctx.quadraticCurveTo(128, 0, 256, 50); ctx.lineTo(256, 100); ctx.lineTo(0, 100); ctx.fill(); }
            else if (bgStyle === 18) { ctx.fillStyle = bg2; ctx.fillRect(0, 0, 256, 20); ctx.fillRect(0, 80, 256, 20); }
            else if (bgStyle === 19) { ctx.fillStyle = bg2; for (let i = 0; i < 100; i += 10) ctx.fillRect(0, i, 30, 5); }
            else if (bgStyle === 20) { ctx.fillStyle = bg2; ctx.fillRect(0, 0, 40, 100); ctx.fillStyle = acc1; for (let i = 5; i < 100; i += 15) ctx.fillRect(5, i, 30, 5); }
            else if (bgStyle === 21) { ctx.fillStyle = bg1; ctx.fillRect(0, 0, 256, 50); ctx.fillStyle = bg2; ctx.fillRect(0, 50, 256, 50); }
            else if (bgStyle === 22) { ctx.fillStyle = bg1; ctx.fillRect(0, 0, 256, 33); ctx.fillStyle = bg2; ctx.fillRect(0, 33, 256, 34); ctx.fillStyle = acc1; ctx.fillRect(0, 67, 256, 33); }
            else if (bgStyle === 23) { ctx.fillStyle = bg2; ctx.beginPath(); ctx.ellipse(128, 50, 140, 60, 0, 0, Math.PI * 2); ctx.fill(); }
            else if (bgStyle === 24) { ctx.fillStyle = bg2; for (let ix = 0; ix <= 256; ix += 40) for (let iy = 0; iy <= 100; iy += 40) { ctx.beginPath(); ctx.moveTo(ix, iy - 20); ctx.lineTo(ix + 20, iy); ctx.lineTo(ix, iy + 20); ctx.lineTo(ix - 20, iy); ctx.fill(); } }
            else if (bgStyle === 25) { ctx.fillStyle = bg2; ctx.fillRect(0, 0, 50, 100); ctx.fillStyle = bg1; ctx.fillRect(50, 0, 206, 100); }
            else if (bgStyle === 26) { ctx.fillStyle = bg1; ctx.fillRect(0, 0, 256, 100); ctx.fillStyle = bg2; ctx.beginPath(); for (let i = -100; i < 350; i += 30) { ctx.moveTo(i, 0); ctx.lineTo(i + 15, 0); ctx.lineTo(i - 85, 100); ctx.lineTo(i - 100, 100); } ctx.fill(); }
            else if (bgStyle === 27) { ctx.fillStyle = bg1; ctx.fillRect(0, 0, 256, 100); ctx.fillStyle = acc1; ctx.fillRect(0, 0, 256, 25); ctx.fillRect(0, 75, 256, 25); }
            else if (bgStyle === 28) { ctx.fillStyle = bg1; ctx.fillRect(0, 0, 256, 100); ctx.fillStyle = bg2; ctx.beginPath(); ctx.arc(40, 50, 45, 0, Math.PI * 2); ctx.fill(); }
            else if (bgStyle === 29) { ctx.fillStyle = bg1; ctx.fillRect(0, 0, 256, 30); ctx.fillStyle = acc2; ctx.fillRect(0, 30, 256, 70); }
            else if (bgStyle === 30) { ctx.fillStyle = acc1; ctx.fillRect(0, 0, 256, 50); ctx.fillStyle = bg2; ctx.fillRect(0, 50, 256, 50); ctx.fillStyle = '#111'; ctx.fillRect(0, 48, 256, 4); } 
            else if (bgStyle === 31) { ctx.fillStyle = acc2; ctx.fillRect(0, 0, 75, 100); ctx.fillStyle = bg1; ctx.fillRect(75, 0, 181, 100); } 
            else if (bgStyle === 32) { ctx.fillStyle = bg1; ctx.fillRect(0, 0, 256, 100); ctx.fillStyle = bg2; for(let i=-50; i<300; i+=20) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i+10, 0); ctx.lineTo(i-10, 100); ctx.lineTo(i-20, 100); ctx.fill(); } } 
            else if (bgStyle === 33) { ctx.fillStyle = bg1; ctx.fillRect(0, 0, 256, 100); ctx.fillStyle = bg2; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(256,100); ctx.lineTo(0,100); ctx.fill(); } 
            else if (bgStyle === 34) { ctx.fillStyle = bg2; ctx.fillRect(0, 0, 256, 25); ctx.fillRect(0, 75, 256, 25); ctx.fillStyle = acc1; ctx.fillRect(0, 25, 256, 5); ctx.fillRect(0, 70, 256, 5); } 
            else if (bgStyle === 35) { ctx.fillStyle = bg1; ctx.fillRect(0, 0, 256, 100); ctx.fillStyle = bg2; ctx.beginPath(); ctx.moveTo(0, 100); ctx.lineTo(150, 0); ctx.lineTo(256, 0); ctx.lineTo(256, 100); ctx.fill(); ctx.fillStyle = '#111111'; ctx.beginPath(); ctx.moveTo(150, 100); ctx.lineTo(256, 0); ctx.lineTo(256, 100); ctx.fill(); } 
            else if (bgStyle === 36) { ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, 256, 100); ctx.fillStyle = acc1; ctx.fillRect(10, 10, 40, 40); ctx.strokeStyle = '#333'; ctx.lineWidth = 2; ctx.strokeRect(5, 5, 246, 90); }
            else if (bgStyle === 37) { ctx.fillStyle = bg1; ctx.fillRect(0,0,256,100); ctx.fillStyle = bg2; ctx.beginPath(); for(let i=0; i<16; i++) { let angle1 = (i/16) * Math.PI*2; let angle2 = ((i+0.5)/16) * Math.PI*2; ctx.moveTo(128,50); ctx.lineTo(128+Math.cos(angle1)*200, 50+Math.sin(angle1)*200); ctx.lineTo(128+Math.cos(angle2)*200, 50+Math.sin(angle2)*200); } ctx.fill(); }
            else if (bgStyle === 38) { ctx.fillStyle = bg1; ctx.fillRect(0,0,256,100); ctx.fillStyle = bg2; for(let x=0; x<280; x+=20) { for(let y=0; y<120; y+=20) { let offset = (y/20)%2===0 ? 0 : 10; ctx.beginPath(); ctx.arc(x+offset, y, 7, 0, Math.PI*2); ctx.fill(); } } }
            else if (bgStyle === 39) { ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,256,100); ctx.fillStyle = acc1; ctx.fillRect(20,0,60,60); ctx.fillStyle = acc2; ctx.fillRect(150,40,106,60); ctx.fillStyle = bg2; ctx.fillRect(0, 70, 80, 30); ctx.strokeStyle = '#000'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(80,0); ctx.lineTo(80,100); ctx.moveTo(0,60); ctx.lineTo(256,60); ctx.moveTo(150,0); ctx.lineTo(150,100); ctx.stroke(); }

    <script>
        const mockArtists = ["Elvis Presley", "Chuck Berry", "Little Richard", "Fats Domino", "Buddy Holly", "Jerry Lee Lewis", "Gene Vincent", "Roy Orbison", "Everly Brothers", "Ray Charles", "Sam Cooke", "Jackie Wilson", "The Drifters", "The Coasters", "Dion", "Patsy Cline", "Brenda Lee", "Bill Haley", "Carl Perkins", "Ricky Nelson", "Wanda Jackson", "Ritchie Valens", "Frank Sinatra", "Dean Martin", "Paul Anka", "Johnny Cash", "The Platters", "Etta James"];
        const mockAdjectives = ["Blue", "Crazy", "Sweet", "Rockin'", "Wild", "Lonely", "Shake", "Rollin'", "Magic", "Jive", "Good", "Bad", "Fast", "Slow", "Heartbreak", "Midnight", "Silver", "Golden", "Happy", "Sad", "Twistin'", "Atomic", "Neon", "Plastic", "Radio"];
        const mockNouns = ["Shoes", "Love", "Baby", "Night", "Heart", "Star", "Moon", "Cat", "Dog", "Train", "Tears", "Dreams", "Doll", "Angel", "Boogie", "Twist", "Beat", "Town", "River", "Road", "Dance", "Rocket", "Juke", "Diner", "Flame"];
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split('');

        const grid = document.getElementById('card-grid');

        function generateRandomSongData() {
            const randIdx = (arr) => Math.floor(Math.random() * arr.length);
            
            const artist = mockArtists[randIdx(mockArtists)];
            const titleA = mockAdjectives[randIdx(mockAdjectives)] + " " + mockNouns[randIdx(mockNouns)];
            const titleB = mockAdjectives[randIdx(mockAdjectives)] + " " + mockNouns[randIdx(mockNouns)];
            const code = letters[randIdx(letters)] + (Math.floor(Math.random() * 20) + 1);
            
            const stateRoll = Math.random();
            let source = 'playlist';
            if (stateRoll > 0.95) source = 'now';
            else if (stateRoll > 0.90) source = 'queue';

            return { titleA, titleB, artist, code, source };
        }

        function renderCards(count, clearFirst = false) {
            if (clearFirst) grid.innerHTML = '';
            
            document.fonts.ready.then(() => {
                for (let i = 0; i < count; i++) {
                    const songData = generateRandomSongData();
                    const result = generateCardArt(songData);
                    
                    result.canvas.title = `[${songData.code}] ${songData.titleA} / ${songData.titleB} - by ${songData.artist}`;
                    grid.appendChild(result.canvas);
                }
            });
        }

        renderCards(50);

        document.getElementById('btn-generate-50').addEventListener('click', () => {
            renderCards(50, true);
        });

        document.getElementById('btn-add-20').addEventListener('click', () => {
            renderCards(20, false);
        });
    </script>
