<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>@spacedevin/juke-cards demo</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Courier+Prime:wght@400;700&family=Oswald:wght@500;700&family=Pacifico&family=Rubik+Mono+One&display=swap" rel="stylesheet" />
  <style>
    body { margin: 0; background: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; }
    header { padding: 1.5rem; border-bottom: 1px solid #334155; }
    #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; padding: 1rem; }
    canvas { border-radius: 4px; box-shadow: 0 8px 24px rgba(0,0,0,0.45); image-rendering: pixelated; width: 256px; height: 100px; }
    button { margin-top: 0.5rem; padding: 0.5rem 1rem; background: #0891b2; color: white; border: none; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <h1>@spacedevin/juke-cards</h1>
    <p>Deterministic procedural jukebox slot cards (256×100)</p>
    <button id="regen">Regenerate grid</button>
  </header>
  <div id="grid"></div>
  <script type="module">
    import { generateCardArt, preloadCardFonts } from "../lib/index.mjs"

    const titles = [
      ["JOHNNY B", "GOODE", "Chuck Berry"],
      ["ROCK AROUND", "THE CLOCK", "Bill Haley"],
      ["GREAT BALLS", "OF FIRE", "Jerry Lee Lewis"],
      ["PEGGY SUE", "PART II", "Buddy Holly"],
      ["BLUE SUEDE", "SHOES", "Carl Perkins"],
    ]

    async function render() {
      try { await preloadCardFonts() } catch {}
      const grid = document.getElementById("grid")
      grid.innerHTML = ""
      let i = 0
      while (i < 20) {
        const t = titles[i % titles.length]
        const art = generateCardArt({
          titleA: t[0], titleB: t[1], artist: t[2],
          code: "K" + String(i + 1),
        })
        const wrap = document.createElement("div")
        wrap.appendChild(art.canvas)
        grid.appendChild(wrap)
        i = i + 1
      }
    }

    document.getElementById("regen").onclick = () => { void render() }
    void render()
  </script>
</body>
</html>
