[package]
name = "tish-juke-scene"
version = "0.1.0"
edition = "2021"
description = "Metal jukebox scene for iOS (tish:juke-scene)"
license = "PIF"

[dependencies]
tishlang_core = { path = "../../../tish/tish/crates/tish_core" }
tish-apple-common = { path = "../../../tish/tish-apple/crates/tish-apple-common" }

[target.'cfg(target_os = "ios")'.dependencies]
metal = "0.29"
objc2 = { version = "0.6", default-features = true }
objc2-foundation = { version = "0.3", default-features = true, features = ["NSRunLoop"] }
objc2-ui-kit = { version = "0.3", default-features = true, features = [
    "UIView",
    "UIColor",
    "UITouch",
    "UIEvent",
    "UILabel",
] }
objc2-metal = { version = "0.3", default-features = true, features = ["MTLDevice", "MTLPixelFormat"] }
objc2-quartz-core = { version = "0.3", default-features = true, features = [
    "CADisplayLink",
    "CALayer",
    "CAMetalLayer",
    "CABase",
    "objc2-metal",
] }
objc2-core-foundation = { version = "0.3", default-features = true, features = ["CFCGTypes"] }
