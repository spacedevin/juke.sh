<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D 50s Diner Jukebox - Roller Rink & Mechanics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Courier+Prime:wght@400;700&family=Fjalla+One&family=Impact&family=Oswald:wght@500;700&family=Righteous&family=Pacifico&family=Lobster&family=Fascinate&family=Limelight&family=Poiret+One&family=Yellowtail&family=Satisfy&family=Permanent+Marker&family=Shrikhand&family=Monoton&family=Bungee&family=Rampart+One&family=Cinzel:wght@700&family=Playfair+Display:wght@900&family=Abril+Fatface&family=Rubik+Mono+One&family=Bangers&family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: radial-gradient(circle at center, #11090c 0%, #000000 100%);
            font-family: 'Courier Prime', monospace;
            touch-action: none;
        }
        #webgl-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }
        .instruction-badge {
            background: rgba(0, 0, 0, 0.8);
            color: #00ffff;
            padding: 8px 24px;
            border-radius: 999px;
            border: 1px solid #00ffff;
            font-size: 14px;
            font-family: 'Righteous', sans-serif;
            letter-spacing: 2px;
            backdrop-filter: blur(8px);
            text-shadow: 0 0 8px #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4), inset 0 0 10px rgba(0, 255, 255, 0.2);
            animation: pulse-neon 2s infinite;
        }
        #now-playing {
            margin-top: 16px;
            background: rgba(20, 10, 15, 0.95);
            color: #ff00ff;
            padding: 16px 36px;
            border-radius: 16px;
            border: 3px solid #ff00ff;
            font-size: 20px;
            font-family: 'Righteous', sans-serif;
            text-transform: uppercase;
            box-shadow: 0 15px 35px rgba(0,0,0,0.9), 0 0 20px rgba(255, 0, 255, 0.5), inset 0 0 15px rgba(255, 0, 255, 0.3);
            text-shadow: 0 0 10px #ff00ff;
            opacity: 1;
            transform: translateY(0);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 90vw;
            text-align: center;
        }
        #now-playing.idle {
            opacity: 0;
            transform: translateY(-30px);
        }
        .marquee { display: inline-block; }
        @keyframes pulse-neon {
            0% { box-shadow: 0 0 15px rgba(0, 255, 255, 0.4), inset 0 0 10px rgba(0, 255, 255, 0.2); }
            50% { box-shadow: 0 0 25px rgba(0, 255, 255, 0.8), inset 0 0 15px rgba(0, 255, 255, 0.5); }
            100% { box-shadow: 0 0 15px rgba(0, 255, 255, 0.4), inset 0 0 10px rgba(0, 255, 255, 0.2); }
        }
        #button-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 20;
        }
        #button-container button {
            pointer-events: auto;
            background: rgba(20, 10, 15, 0.8);
            color: #00ffff;
            border: 2px solid #00ffff;
            padding: 10px 20px;
            border-radius: 8px;
            font-family: 'Righteous', sans-serif;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            backdrop-filter: blur(4px);
        }
        #button-container button:hover {
            background: rgba(0, 255, 255, 0.2);
        }
        #fit-toggle {
            color: #ff00ff !important;
            border-color: #ff00ff !important;
        }
        #fit-toggle:hover {
            background: rgba(255, 0, 255, 0.2) !important;
        }
    </style>
</head>
<body>

<div id="webgl-container"></div>
<div id="ui-overlay">
    <div class="instruction-badge">DRAG TO SPIN • TAP TO PLAY</div>
    <div id="now-playing">
        <span class="marquee" id="np-text">Loading Fonts & 432 Records...</span>
    </div>
</div>
<div id="button-container">
    <button id="lighting-toggle">LIGHTING: ROLLER RINK</button>
    <button id="fit-toggle">ZOOM TO CARDS</button>
</div>

<script>
    // --- UI MODE STATES ---
    let isClassicLighting = false;
    document.getElementById('lighting-toggle').addEventListener('click', (e) => {
        isClassicLighting = !isClassicLighting;
        e.target.innerText = isClassicLighting ? 'LIGHTING: CLASSIC DINER' : 'LIGHTING: ROLLER RINK';
        e.target.style.color = isClassicLighting ? '#ffaa55' : '#00ffff';
        e.target.style.borderColor = isClassicLighting ? '#ffaa55' : '#00ffff';
    });

    let isFitMode = true;
    let isAutoTransitioning = false;
    document.getElementById('fit-toggle').addEventListener('click', (e) => {
        isFitMode = !isFitMode;
        e.target.innerText = isFitMode ? 'ZOOM TO CARDS' : 'FIT TO SCREEN';
        isAutoTransitioning = true;
    });

    // --- AUDIO SYSTEM ---
    let audioInitialized = false;
    let clunkSynth, beepSynth, humSynth;

    async function initAudio() {
        if (audioInitialized) return;
        await Tone.start();
        
        clunkSynth = new Tone.MembraneSynth({
            pitchDecay: 0.01, octaves: 2, oscillator: { type: "square" },
            envelope: { attack: 0.001, decay: 0.1, sustain: 0, release: 0.1 }
        }).toDestination();
        clunkSynth.volume.value = -5;

        beepSynth = new Tone.PolySynth(Tone.Synth, {
            oscillator: { type: "triangle" },
            envelope: { attack: 0.05, decay: 0.2, sustain: 0.2, release: 1 }
        }).toDestination();
        beepSynth.volume.value = -12;

        humSynth = new Tone.Noise("pink");
        const lowpass = new Tone.Filter(150, "lowpass").toDestination();
        humSynth.connect(lowpass);
        humSynth.volume.value = -25; 

        audioInitialized = true;
    }

    function playSelectionSound() {
        if (!audioInitialized) return;
        clunkSynth.triggerAttackRelease("G1", "16n");
        setTimeout(() => { beepSynth.triggerAttackRelease(["C4", "E4", "G4"], "8n"); }, 150);
        if (humSynth.state !== "started") humSynth.start();
    }

    // --- THREE.JS SETUP ---
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();
    
    scene.fog = new THREE.Fog(0x0a0508, 100, 300);
    scene.background = new THREE.Color(0x0a0508);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 5, 60); 

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxDistance = 300; 
    controls.minDistance = 22;
    controls.minAzimuthAngle = -Infinity;
    controls.maxAzimuthAngle = Infinity;
    controls.minPolarAngle = Math.PI / 6;
    controls.maxPolarAngle = Math.PI / 2 + 0.1; 
    
    controls.addEventListener('start', () => {
        isAutoTransitioning = false;
    });

    // Base lighting setup
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x333333, 0.5);
    scene.add(hemiLight);
    
    // Dedicated Ambient Light ONLY for Zoomed-In Flat UI Mode
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.0);
    scene.add(ambientLight);
    
    const dirLight = new THREE.DirectionalLight(0xffeedd, 0.5);
    dirLight.position.set(0, 20, 30);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.camera.near = 10;
    dirLight.shadow.camera.far = 300; 
    dirLight.shadow.camera.left = -40;
    dirLight.shadow.camera.right = 40;
    dirLight.shadow.camera.top = 40;
    dirLight.shadow.camera.bottom = -40;
    dirLight.shadow.bias = -0.001;
    scene.add(dirLight);

    // Camera Headlight: Shines exactly where you look to give specular highlights to brackets when zoomed in
    const cameraLight = new THREE.DirectionalLight(0xffffff, 0.0);
    scene.add(cameraLight);
    scene.add(cameraLight.target);
    
    const pointLight1 = new THREE.PointLight(0x00ffff, 1.2, 80);
    pointLight1.position.set(-25, 10, 25);
    scene.add(pointLight1);
    const pointLight2 = new THREE.PointLight(0xff00ff, 1.2, 80);
    pointLight2.position.set(25, -10, -25);
    scene.add(pointLight2);

    // --- 360 DRUM CAROUSEL MATH ---
    const COLS = 36;
    const ROWS = 12; 
    const CARD_W = 3.2;
    const CARD_H = 1.25;
    const ROW_SPACING = 1.4;
    const ANGLE_RANGE = Math.PI * 2;
    const COL_ANGLE = ANGLE_RANGE / COLS;
    const R = (COLS * (CARD_W + 0.3)) / (2 * Math.PI); 
    const startY = (ROWS * ROW_SPACING) / 2 - ROW_SPACING / 2;
    const HEIGHT_TOTAL = ROWS * ROW_SPACING + 4;

    const jukeboxGroup = new THREE.Group();
    scene.add(jukeboxGroup);

    // --- 1950s DINER CHECKERBOARD FLOOR ---
    const floorCanvas = document.createElement('canvas');
    floorCanvas.width = 1024; floorCanvas.height = 1024;
    const fctx = floorCanvas.getContext('2d');
    fctx.fillStyle = '#050505'; fctx.fillRect(0,0,1024,1024);
    fctx.fillStyle = '#e8e8e8';
    for(let i=0; i<1024; i+=128) {
        for(let j=0; j<1024; j+=128) {
            if((i/128 + j/128)%2 === 0) fctx.fillRect(i,j,128,128);
        }
    }
    const floorTex = new THREE.CanvasTexture(floorCanvas);
    floorTex.wrapS = THREE.RepeatWrapping; floorTex.wrapT = THREE.RepeatWrapping;
    floorTex.repeat.set(16, 16);
    floorTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    
    const floorMat = new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.1, metalness: 0.4, color: 0xaaaaaa }); 
    const floorMesh = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), floorMat);
    floorMesh.rotation.x = -Math.PI / 2;
    floorMesh.position.y = -HEIGHT_TOTAL / 2 - 3;
    floorMesh.receiveShadow = true; 
    scene.add(floorMesh);

    // --- PROCEDURAL CHROME ENVIRONMENT MAP ---
    const envCanvas = document.createElement('canvas');
    envCanvas.width = 1024; envCanvas.height = 512;
    const envCtx = envCanvas.getContext('2d');
    
    envCtx.fillStyle = '#050203'; envCtx.fillRect(0,0,1024,512);
    for(let i=0; i<30; i++) {
        envCtx.fillStyle = ['#00ffff', '#ff00ff', '#ffffff', '#ffaa00'][Math.floor(Math.random()*4)];
        envCtx.globalAlpha = 0.2 + Math.random() * 0.8;
        envCtx.fillRect(Math.random()*1024, Math.random()*512, 100 + Math.random()*300, 5 + Math.random()*20);
    }
    
    const envTex = new THREE.CanvasTexture(envCanvas);
    envTex.mapping = THREE.EquirectangularReflectionMapping;
    scene.environment = envTex;

    // --- JUKEBOX HARDWARE ---
    const goldMaterial = new THREE.MeshStandardMaterial({ color: 0xe5b45c, metalness: 1.0, roughness: 0.15 });
    const chromeMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee, metalness: 1.0, roughness: 0.1 });
    const tealMaterial = new THREE.MeshStandardMaterial({ color: 0x006666, metalness: 0.4, roughness: 0.4 });
    const drumMaterial = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.7, roughness: 0.3 });
    const aluminumMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, metalness: 0.9, roughness: 0.4 }); 
    const whiteBracketMat = new THREE.MeshStandardMaterial({ color: 0xf0f0f0, metalness: 0.2, roughness: 0.6 }); 

    const drumMesh = new THREE.Mesh(new THREE.CylinderGeometry(R + 0.02, R + 0.02, HEIGHT_TOTAL - 1, 64), drumMaterial);
    drumMesh.receiveShadow = true;
    jukeboxGroup.add(drumMesh);

    const rimGeo = new THREE.TorusGeometry(R + 0.2, 0.6, 16, 64);
    const topRim = new THREE.Mesh(rimGeo, goldMaterial);
    topRim.rotation.x = Math.PI / 2; topRim.position.y = HEIGHT_TOTAL / 2;
    topRim.castShadow = true;
    jukeboxGroup.add(topRim);
    const botRim = new THREE.Mesh(rimGeo, goldMaterial);
    botRim.rotation.x = Math.PI / 2; botRim.position.y = -HEIGHT_TOTAL / 2;
    jukeboxGroup.add(botRim);

    const neonGeo = new THREE.TorusGeometry(R + 1.2, 0.15, 16, 64);
    const neonMatTop = new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x00ffff, emissiveIntensity: 2.0 });
    const neonTop = new THREE.Mesh(neonGeo, neonMatTop);
    neonTop.rotation.x = Math.PI / 2; neonTop.position.y = HEIGHT_TOTAL / 2 + 0.5;
    jukeboxGroup.add(neonTop);
    
    const neonMatBot = new THREE.MeshStandardMaterial({ color: 0xff00ff, emissive: 0xff00ff, emissiveIntensity: 2.0 });
    const neonBot = new THREE.Mesh(neonGeo, neonMatBot);
    neonBot.rotation.x = Math.PI / 2; neonBot.position.y = -HEIGHT_TOTAL / 2 - 0.5;
    jukeboxGroup.add(neonBot);

    const glassGeo = new THREE.CylinderGeometry(R + 1.6, R + 1.6, HEIGHT_TOTAL + 2, 64, 1, true);
    const glassMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: 0.1, roughness: 0.05, metalness: 0.9, clearcoat: 1.0, side: THREE.FrontSide });
    jukeboxGroup.add(new THREE.Mesh(glassGeo, glassMat));

    for (let i = 0; i < COLS; i++) {
        const theta = i * COL_ANGLE;
        const bracketGroup = new THREE.Group();
        
        if (i % 2 === 0) {
            const baseMesh = new THREE.Mesh(new THREE.BoxGeometry(0.5, HEIGHT_TOTAL - 2, 0.4), tealMaterial);
            baseMesh.castShadow = true; baseMesh.receiveShadow = true;
            bracketGroup.add(baseMesh);
            
            const pipeL = new THREE.Mesh(new THREE.BoxGeometry(0.04, HEIGHT_TOTAL - 2, 0.04), chromeMat);
            pipeL.position.set(-0.15, 0, 0.2); 
            bracketGroup.add(pipeL);
            
            const pipeR = new THREE.Mesh(new THREE.BoxGeometry(0.04, HEIGHT_TOTAL - 2, 0.04), chromeMat);
            pipeR.position.set(0.15, 0, 0.2);
            bracketGroup.add(pipeR);

            bracketGroup.position.set(Math.sin(theta) * (R + 0.12), 0, Math.cos(theta) * (R + 0.12));
        } else {
            const baseMesh = new THREE.Mesh(new THREE.BoxGeometry(0.3, HEIGHT_TOTAL - 2, 0.15), aluminumMat);
            baseMesh.castShadow = true; baseMesh.receiveShadow = true;
            bracketGroup.add(baseMesh);
            
            const spineMesh = new THREE.Mesh(new THREE.BoxGeometry(0.1, HEIGHT_TOTAL - 2, 0.08), chromeMat);
            spineMesh.position.set(0, 0, 0.1);
            bracketGroup.add(spineMesh);

            bracketGroup.position.set(Math.sin(theta) * (R + 0.12), 0, Math.cos(theta) * (R + 0.12));
        }
        
        bracketGroup.rotation.y = theta; 
        jukeboxGroup.add(bracketGroup);
    }

    for (let r = 0; r <= ROWS; r++) {
        const y = startY - r * ROW_SPACING + ROW_SPACING / 2;
        const ringGeo = new THREE.TorusGeometry(R + 0.08, 0.1, 16, 64);
        const ringMesh = new THREE.Mesh(ringGeo, whiteBracketMat);
        ringMesh.rotation.x = Math.PI / 2;
        ringMesh.position.y = y;
        ringMesh.castShadow = true;
        ringMesh.receiveShadow = true;
        jukeboxGroup.add(ringMesh);
    }

    const ledGeo = new THREE.CylinderGeometry(0.02, 0.02, CARD_W - 0.1, 8);
    ledGeo.rotateZ(Math.PI / 2); 
    const ledMat = new THREE.MeshBasicMaterial({ color: 0x111111 });

    const localLed1 = new THREE.PointLight(0xffd580, 0, 15);
    const ledMesh1 = new THREE.Mesh(ledGeo, ledMat);
    localLed1.add(ledMesh1);
    jukeboxGroup.add(localLed1);

    const localLed2 = new THREE.PointLight(0xffd580, 0, 15);
    const ledMesh2 = new THREE.Mesh(ledGeo, ledMat);
    localLed2.add(ledMesh2);
    jukeboxGroup.add(localLed2);

    // --- PROCEDURAL DATA & MODULAR GENERATOR ---
    function xmur3(str) {
        for(var i = 0, h = 1779033703 ^ str.length; i < str.length; i++) {
            h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
            h = h << 13 | h >>> 19;
        } return function() {
            h = Math.imul(h ^ (h >>> 16), 2246822507);
            h = Math.imul(h ^ (h >>> 13), 3266489909);
            return (h ^= h >>> 16) >>> 0;
        }
    }

    const artists = ["Elvis Presley", "Chuck Berry", "Little Richard", "Fats Domino", "Buddy Holly", "Jerry Lee Lewis", "Gene Vincent", "Roy Orbison", "Everly Brothers", "Ray Charles", "Sam Cooke", "Jackie Wilson", "The Drifters", "The Coasters", "Dion", "Patsy Cline", "Brenda Lee", "Bill Haley", "Carl Perkins", "Ricky Nelson", "Wanda Jackson", "Ritchie Valens", "Frank Sinatra", "Dean Martin", "Paul Anka", "Johnny Cash", "The Platters", "Etta James"];
    const adjectives = ["Blue", "Crazy", "Sweet", "Rockin'", "Wild", "Lonely", "Shake", "Rollin'", "Magic", "Jive", "Good", "Bad", "Fast", "Slow", "Heartbreak", "Midnight", "Silver", "Golden", "Happy", "Sad", "Twistin'", "Atomic", "Neon", "Plastic", "Radio"];
    const nouns = ["Shoes", "Love", "Baby", "Night", "Heart", "Star", "Moon", "Cat", "Dog", "Train", "Tears", "Dreams", "Doll", "Angel", "Boogie", "Twist", "Beat", "Town", "River", "Road", "Dance", "Rocket", "Juke", "Diner", "Flame"];
    const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split('');
    
    let playlist = [];
    for(let i=0; i < (COLS * ROWS); i++) {
        let art = artists[i % artists.length];
        let titleA = adjectives[(i * 3) % adjectives.length] + " " + nouns[(i * 7) % nouns.length];
        let titleB = adjectives[(i * 5) % adjectives.length] + " " + nouns[(i * 11) % nouns.length];
        let code = letters[Math.floor(i / ROWS) % letters.length] + ((i % ROWS) + 1);
        playlist.push({ titleA, titleB, artist: art, code });
    }
    playlist = playlist.sort(() => Math.random() - 0.5);

    const palettes = [
        ['#e63946', '#f1faee', '#1d3557', '#a8dadc'], ['#ffb703', '#fb8500', '#023047', '#8ecae6'],
        ['#ef476f', '#ffd166', '#06d6a0', '#073b4c'], ['#ffffff', '#000000', '#dddddd', '#ff0000'],
        ['#f4a261', '#e76f51', '#2a9d8f', '#264653'], ['#8ecae6', '#219ebc', '#023047', '#ffb703'],
        ['#d9ed92', '#b5e48c', '#34a0a4', '#1a759f'], ['#2b2d42', '#8d99ae', '#edf2f4', '#d90429'],
        ['#000000', '#14213d', '#fca311', '#e5e5e5'], ['#3d5a80', '#98c1d9', '#e0fbfc', '#ee6c4d'],
        ['#ff9f1c', '#ffbf69', '#ffffff', '#cbf3f0'], ['#f72585', '#7209b7', '#3a0ca3', '#4cc9f0'],
        ['#dad7cd', '#a3b18a', '#588157', '#344e41'], ['#fec5bb', '#fcd5ce', '#fae1dd', '#f8edeb'],
        ['#000000', '#d4af37', '#ffffff', '#111111'], ['#ff00ff', '#00ffff', '#000000', '#ffff00'],
        ['#f4e285', '#f4a259', '#5b8e7d', '#bc4b51'], ['#2a0800', '#f4d03f', '#e74c3c', '#ffffff'],
        ['#fdf6e3', '#eee8d5', '#073642', '#cb4b16'], ['#4a4e69', '#9a8c98', '#c9ada7', '#f2e9e4'],
        ['#ff595e', '#ffca3a', '#8ac926', '#1982c4'], ['#1d3557', '#457b9d', '#a8dadc', '#e63946'],
        ['#283618', '#606c38', '#fefae0', '#dda15e'], ['#5f0f40', '#9a031e', '#fb8b24', '#e36414'],
        ['#0b132b', '#1c2541', '#3a506b', '#5bc0be'], ['#335c67', '#fff3b0', '#e09f3e', '#9e2a2b'],
        ['#003049', '#d62828', '#f77f00', '#fcbf49'], ['#22223b', '#4a4e69', '#9a8c98', '#c9ada7'],
        ['#0d3b66', '#faf0ca', '#f4d35e', '#ee964b'], ['#f94144', '#f3722c', '#f8961e', '#f9c74f'],
        ['#5d5c61', '#379683', '#7395ae', '#557a95'], ['#1a1a1d', '#4e4e50', '#6f2232', '#950740'],
        ['#c0c0c0', '#ffffff', '#808080', '#000000'], ['#ffe066', '#247ba0', '#70c1b3', '#50514f'],
        ['#6b2d5c', '#f0386b', '#ff5376', '#f8c0c8']
    ];

    const displayFonts = ["'Anton'", "'Bebas Neue'", "'Impact'", "'Righteous'", "'Fjalla One'", "'Limelight'", "'Rampart One'", "'Rubik Mono One'", "'Abril Fatface'", "'Bungee'", "'Bangers'"];
    const scriptFonts = ["'Pacifico'", "'Lobster'", "'Yellowtail'", "'Satisfy'", "'Shrikhand'", "'Permanent Marker'", "'Fascinate'"];
    const infoFonts = ["'Courier Prime'", "'Oswald'", "'Cinzel'", "'Playfair Display'", "'Poiret One'", "Arial"];

    function getContrast(hex) {
        if (!hex || hex[0] !== '#') return '#000000';
        let r = parseInt(hex.substr(1,2), 16); let g = parseInt(hex.substr(3,2), 16); let b = parseInt(hex.substr(5,2), 16);
        return (((r*299)+(g*587)+(b*114))/1000 >= 128) ? '#000000' : '#ffffff';
    }

    const cards = [];
    let activeCard = null;

    function generateCardTexture(song) {
        const seedStr = song.titleA + song.artist + song.code;
        const seedGen = xmur3(seedStr);
        const rnd = () => (seedGen() >>> 0) / 4294967296;
        const rndInt = (max) => Math.floor(rnd() * max);

        const canvas = document.createElement('canvas');
        canvas.width = 256; canvas.height = 100;
        const ctx = canvas.getContext('2d');

        // Bounded to 30 styles matching our massive visual dictionary
        const bgStyle = rndInt(30); const decorStyle = rndInt(30);
        const borderStyle = rndInt(9); const layoutStyle = rndInt(30);
        const fDisp = displayFonts[rndInt(displayFonts.length)];

        else if(layoutStyle===15){ drawAdvText(tA, 128, 40, "40px " + fDisp, mTxt, 'center', 1, 1.4); drawAdvText(art + " • " + cd, 240, 85, "12px " + fInfo, aTxt, 'right'); }
        else if(layoutStyle===16){ ctx.fillStyle = aTxt; ctx.fillRect(0,0,60,100); drawAdvText(cd, 30, 50, "bold 20px " + fInfo, getContrast(aTxt), 'center'); drawAdvText(tA, 70, 30, "22px " + fDisp, mTxt, 'left'); drawAdvText(art, 70, 60, "16px " + fScrpt, aTxt, 'left'); drawAdvText(tB, 70, 85, "14px " + fDisp, mTxt, 'left'); }
        else if(layoutStyle===17){ drawAdvText(tA, 130, 42, "28px " + fDisp, '#000000', 'center', 1, 1); drawAdvText(tA, 128, 40, "28px " + fDisp, mTxt, 'center', 1, 1); drawAdvText("BY " + art, 128, 75, "16px " + fInfo, aTxt, 'center'); boxCode(10, 10, 35, 20); }
        else if(layoutStyle===18){ drawAdvText(art, 128, 20, "14px " + fInfo, aTxt, 'center'); ctx.fillStyle = mTxt; ctx.fillRect(20, 35, 216, 35); drawAdvText(tA, 128, 53, "24px " + fDisp, getContrast(mTxt), 'center'); drawAdvText(tB, 128, 85, "14px " + fScrpt, mTxt, 'center'); }
        else if(layoutStyle===19){ drawAdvText(tA.charAt(0), 40, 50, "60px " + fDisp, aTxt, 'center'); drawAdvText(tA.slice(1), 75, 40, "24px " + fDisp, mTxt, 'left'); drawAdvText(art, 75, 70, "18px " + fScrpt, mTxt, 'left'); drawAdvText(cd, 240, 20, "12px Arial", aTxt, 'right'); }
        else if(layoutStyle===20){ boxCode(10, 10, 35, 20); drawAdvText(tA, 240, 40, "24px " + fDisp, mTxt, 'right', 1, 1.2); drawAdvText(art, 240, 75, "16px " + fScrpt, aTxt, 'right'); }
        else if(layoutStyle===21){ drawAdvText(tA.split(' ')[0], 40, 35, "26px " + fDisp, mTxt, 'left'); drawAdvText(tA.split(' ').slice(1).join(' ') || "HIT", 216, 65, "26px " + fDisp, mTxt, 'right'); drawAdvText(cd + " • " + art, 128, 50, "12px " + fInfo, aTxt, 'center'); }
        else if(layoutStyle===22){ drawAdvText(art + " [" + cd + "]", 128, 25, "14px " + fInfo, aTxt, 'center'); drawAdvText(tA, 128, 65, "36px " + fDisp, mTxt, 'center', 1, 1.5); }
        else if(layoutStyle===23){ ctx.strokeStyle = mTxt; ctx.lineWidth = 1.5; ctx.font = "30px " + fDisp; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.strokeText(tA, 128, 40, 240); drawAdvText(art, 128, 75, "16px " + fScrpt, aTxt, 'center'); drawAdvText(cd, 20, 20, "12px Arial", mTxt, 'center'); }
        else if(layoutStyle===24){ drawAdvText(tA, 128, 35, "28px " + fDisp, mTxt, 'center', 1.2, 1); ctx.fillStyle = aTxt; ctx.fillRect(64, 65, 128, 20); drawAdvText(art, 128, 75, "14px " + fInfo, getContrast(aTxt), 'center'); boxCode(210, 70, 35, 20); }
        else if(layoutStyle===25){ drawAdvText(art, 128, 20, "14px " + fInfo, aTxt, 'center'); drawAdvText(tA, 128, 60, "40px " + fDisp, mTxt, 'center', 1, 1.2); drawAdvText(cd, 25, 85, "12px Arial", mTxt, 'left'); }
        else if(layoutStyle===26){ drawAdvText(cd, 25, 50, "bold 16px " + fInfo, getContrast(bgStyle===25?bg2:bg1), 'center', 1, 1, -Math.PI/2); drawAdvText(tA, 150, 35, "26px " + fDisp, mTxt, 'center'); drawAdvText(art, 150, 70, "16px " + fScrpt, aTxt, 'center'); }
        else if(layoutStyle===27){ drawAdvText(tA, 128, 25, "18px " + fDisp, mTxt, 'center'); drawAdvText(tB, 128, 50, "18px " + fDisp, mTxt, 'center'); drawAdvText(art, 128, 75, "18px " + fScrpt, aTxt, 'center'); }
        else if(layoutStyle===28){ drawAdvText(art, 128, 25, "16px " + fScrpt, aTxt, 'center'); drawAdvText(tA, 128, 70, "36px " + fDisp, mTxt, 'center', 1.2, 1); }
        else if(layoutStyle===29){ ctx.fillStyle=aTxt; ctx.beginPath(); ctx.moveTo(40,40); ctx.lineTo(216,40); ctx.arc(216,50,10,-Math.PI/2,Math.PI/2); ctx.lineTo(40,60); ctx.arc(40,50,10,Math.PI/2,-Math.PI/2); ctx.fill(); drawAdvText(tA, 128, 50, "18px " + fDisp, getContrast(aTxt), 'center'); drawAdvText(art, 128, 80, "14px " + fInfo, mTxt, 'center'); drawAdvText(cd, 128, 20, "14px Arial", mTxt, 'center'); }

        // Add subtle paper-like noise texture overlay
        for (let i = 0; i < 1500; i++) {
            ctx.fillStyle = (i % 2 === 0) ? '#000000' : '#ffffff';
            ctx.globalAlpha = rnd() * 0.04;
            ctx.fillRect(rndInt(256), rndInt(100), 1.5, 1.5);
        }
        ctx.globalAlpha = 1.0;

        const texture = new THREE.CanvasTexture(canvas);
        texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
        texture.minFilter = THREE.LinearFilter;
        return { texture, accent: acc1, bg: bg1, alt: acc2 };
    }

    function populateJukebox() {
        let songIndex = 0;
        const cardGeo = new THREE.PlaneGeometry(CARD_W, CARD_H);

        for (let c = 0; c < COLS; c++) {
            const theta = -ANGLE_RANGE / 2 + c * COL_ANGLE + COL_ANGLE / 2;
            
            const catCanvas = document.createElement('canvas');
            catCanvas.width = 256; catCanvas.height = 64;
            const cctx = catCanvas.getContext('2d');
            cctx.fillStyle = '#006666'; cctx.fillRect(0, 0, 256, 64);
            cctx.fillStyle = '#ffffff'; cctx.font = "bold 28px 'Oswald', sans-serif";
            cctx.textAlign = 'center'; cctx.textBaseline = 'middle';
            const categories = ["extended play", "varieties", "your picks", "favorites", "soul", "popular", "hit tunes", "jazz", "country", "rock & roll"];
            cctx.fillText(categories[c % categories.length].toUpperCase(), 128, 32);
            
            const catMesh = new THREE.Mesh(new THREE.PlaneGeometry(CARD_W * 0.9, 0.6), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(catCanvas) }));
            catMesh.position.set(Math.sin(theta) * (R + 0.1), -startY - ROW_SPACING, Math.cos(theta) * (R + 0.1));
            catMesh.rotation.y = theta;
            jukeboxGroup.add(catMesh);

            for (let r = 0; r < ROWS; r++) {
                if (songIndex >= playlist.length) break;
                
                const song = playlist[songIndex];
                const { texture: tex, accent: accColor, bg: bgColor, alt: altColor } = generateCardTexture(song);
                
                // Diffuse paper material that softly catches the LED light
                const mat = new THREE.MeshStandardMaterial({ 
                    map: tex, 
                    roughness: 0.85, 
                    metalness: 0.0 
                });
                
                const card = new THREE.Mesh(cardGeo, mat);
                card.castShadow = true;
                card.receiveShadow = true;
                
                const x = Math.sin(theta) * (R + 0.05);
                const z = Math.cos(theta) * (R + 0.05);
                const y = startY - r * ROW_SPACING;
                
                card.position.set(x, y, z);
                card.rotation.y = theta; 
                
                // Added baseY to userData to align the frame LEDs perfectly
                card.userData = { isCard: true, song: song, baseZ: z, baseX: x, baseY: y, theta: theta, accentColor: accColor, bgColor: bgColor, altColor: altColor };
                
                jukeboxGroup.add(card);
                cards.push(card);
                songIndex++;
            }
        }
    }

    document.fonts.ready.then(() => {
        populateJukebox();
        const np = document.getElementById('now-playing');
        document.getElementById('np-text').innerText = "Select a Track";
        np.classList.add('idle'); 
    });

    // --- INTERACTION ---
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    function onPointerDown(event) {
        initAudio(); 
        if (event.touches) {
            mouse.x = (event.touches[0].clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.touches[0].clientY / window.innerHeight) * 2 + 1;
        } else {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        }

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(cards);
        if (intersects.length > 0) selectCard(intersects[0].object);
    }

    function selectCard(card) {
        if (activeCard === card) {
            // Deselect card and turn off
            activeCard = null;
            document.getElementById('now-playing').classList.add('idle');
            return;
        }
        
        playSelectionSound();
        activeCard = card;

        const np = document.getElementById('now-playing');
        np.classList.remove('idle');
        document.getElementById('np-text').innerText = `♫ [${card.userData.song.code}] ${card.userData.song.titleA} - ${card.userData.song.artist} ♫`;

        // Snap the LEDs instantly to the top and bottom edges of the newly selected card
        const data = card.userData;
        const yTop = data.baseY + CARD_H / 2 - 0.02; 
        const yBot = data.baseY - CARD_H / 2 + 0.02;
        
        localLed1.position.set(Math.sin(data.theta) * (R + 0.14), yTop, Math.cos(data.theta) * (R + 0.14));
        localLed1.rotation.y = data.theta; // Align horizontal cylinder parallel to card face
        
        localLed2.position.set(Math.sin(data.theta) * (R + 0.14), yBot, Math.cos(data.theta) * (R + 0.14));
        localLed2.rotation.y = data.theta;
        
        // Reset light intensities so they smoothly fade up in the new position
        localLed1.intensity = 0;
        localLed2.intensity = 0;
        ledMat.color.setHex(0x111111);
    }

    window.addEventListener('pointerdown', onPointerDown);
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- ANIMATION & ROLLER RINK LIGHTING LOOP ---
    const clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        
        // Smoothly constrain vertical tilt when zoomed in (locks to horizontal scroll only)
        const targetMinPolar = isFitMode ? Math.PI / 6 : Math.PI / 2;
        const targetMaxPolar = isFitMode ? Math.PI / 2 + 0.1 : Math.PI / 2;
        
        controls.minPolarAngle += (targetMinPolar - controls.minPolarAngle) * 0.1;
        controls.maxPolarAngle += (targetMaxPolar - controls.maxPolarAngle) * 0.1;
        
        // Safely prevent min from exceeding max during the smooth transition
        if (controls.minPolarAngle > controls.maxPolarAngle) {
            controls.minPolarAngle = controls.maxPolarAngle;
        }

        controls.update();

        // Dynamically push the fog back based on camera distance so the jukebox is NEVER grey/fogged!
        const distToCenter = camera.position.length();
        scene.fog.near = distToCenter + 30; // Fog strictly starts behind the drum
        scene.fog.far = distToCenter + 250; // Smoothly fades out the distant floor

        // 0. Auto-Fit / Telephoto Zoom Logic
        if (isAutoTransitioning) {
            // Dynamically Lerp the Camera's Focal Length (Field of View)
            // 45 = Wide Angle (exaggerates 3D curve), 12 = Telephoto (flattens perspective)
            const targetFOV = isFitMode ? 45 : 12;
            camera.fov += (targetFOV - camera.fov) * 0.08;
            camera.updateProjectionMatrix();

            const vFOV = camera.fov * Math.PI / 180;
            // Snug padding (1 unit) to ensure top and bottom rims are perfectly visible without excess space
            const hDist = (HEIGHT_TOTAL + 1) / (2 * Math.tan(vFOV / 2));
            const wDist = ((R * 2) + 4) / (2 * Math.tan(vFOV / 2) * camera.aspect);
            
            // Choose target distance based on current toggle state
            let targetDist;
            let targetY = 0; // Always center on Y=0 to prevent vertical cropping
            
            if (isFitMode) {
                targetDist = Math.max(hDist, wDist); // Fit entire machine (width and height)
            } else {
                // Exactly fit the column height, letting the sides crop for a perfect close-up read
                targetDist = hDist; 
            }
            
            // Maintain current rotational side, but smoothly pull in/out
            const currentAzimuth = controls.getAzimuthalAngle();
            const targetX = Math.sin(currentAzimuth) * (R + targetDist);
            const targetZ = Math.cos(currentAzimuth) * (R + targetDist);
            
            const targetPos = new THREE.Vector3(targetX, targetY, targetZ);
            camera.position.lerp(targetPos, 0.08);
            controls.target.lerp(new THREE.Vector3(0, targetY/2, 0), 0.08);
            
            // Stop transitioning once we arrive
            if (Math.abs(camera.fov - targetFOV) < 0.5 && camera.position.distanceTo(targetPos) < 0.5) {
                camera.fov = targetFOV;
                camera.updateProjectionMatrix();
                isAutoTransitioning = false; 
            }
        }
        
        // 0.5 Sync camera headlight to perfectly follow the camera's world position
        cameraLight.position.copy(camera.position);
        cameraLight.target.position.copy(controls.target);
        
        const t = clock.getElapsedTime();
        let tColor1 = new THREE.Color();
        let tColor2 = new THREE.Color();

        // 1. Scene Lighting Transition
        if (isClassicLighting) {
            // Static, bright 50s Diner layout for maximal readability
            tColor1.setHex(0xffeedd); 
            tColor2.setHex(0xaaeeff); 
            
            // ZOOMED OUT (isFitMode = true): Beautiful 3D shadows, rich depth.
            // ZOOMED IN (isFitMode = false): Turn OFF main shadows, blast Ambient + Camera light for pure, flat, ultra-readable cards!
            const targetHemi = isFitMode ? 0.45 : 0.0;
            const targetDir = isFitMode ? 0.75 : 0.0; // Shadows OFF when zoomed in!
            
            // Reduced zoomed-in brightness from 1.6 / 0.8 to prevent washing out lighter cards
            const targetAmbient = isFitMode ? 0.0 : 1.2; 
            const targetCamLight = isFitMode ? 0.0 : 0.4; 
            
            hemiLight.intensity += (targetHemi - hemiLight.intensity) * 0.05;
            dirLight.intensity += (targetDir - dirLight.intensity) * 0.05;
            ambientLight.intensity += (targetAmbient - ambientLight.intensity) * 0.05;
            cameraLight.intensity += (targetCamLight - cameraLight.intensity) * 0.05;
        } else {
            if (activeCard) {
                // Lock into a slow, pulsating blend of the selected card's colors
                const c1 = new THREE.Color(activeCard.userData.accentColor);
                const c2 = new THREE.Color(activeCard.userData.bgColor);
                const c3 = new THREE.Color(activeCard.userData.altColor || '#ffffff');
                
                const cycle = (Math.sin(t * 1.5) + 1) / 2;
                tColor1.lerpColors(c1, c2, cycle);
                tColor2.lerpColors(c2, c3, 1.0 - cycle);

                // Roller Rink Active: 
                const targetHemi = isFitMode ? 0.1 : 0.0;
                const targetDir = isFitMode ? 0.1 : 0.0;
                const targetAmbient = isFitMode ? 0.0 : 0.8; // Bright enough to read, moody
                const targetCamLight = isFitMode ? 0.0 : 0.4;

                hemiLight.intensity += (targetHemi - hemiLight.intensity) * 0.05;
                dirLight.intensity += (targetDir - dirLight.intensity) * 0.05;
                ambientLight.intensity += (targetAmbient - ambientLight.intensity) * 0.05;
                cameraLight.intensity += (targetCamLight - cameraLight.intensity) * 0.05;
            } else {
                // Full rainbow idle sweeping
                tColor1.setHSL((t * 0.1) % 1, 0.9, 0.6);
                tColor2.setHSL(((t * 0.1) + 0.5) % 1, 0.9, 0.6);
                
                // Roller Rink Idle:
                const targetHemi = isFitMode ? 0.4 : 0.0;
                const targetDir = isFitMode ? 0.6 : 0.0;
                const targetAmbient = isFitMode ? 0.0 : 1.2; 
                const targetCamLight = isFitMode ? 0.0 : 0.6;

                hemiLight.intensity += (targetHemi - hemiLight.intensity) * 0.05;
                dirLight.intensity += (targetDir - dirLight.intensity) * 0.05;
                ambientLight.intensity += (targetAmbient - ambientLight.intensity) * 0.05;
                cameraLight.intensity += (targetCamLight - cameraLight.intensity) * 0.05;
            }
        }

        // Track camera azimuth so light always shines on the visible face,
        // but keep a constant high altitude (Y=100) and distance to maintain a consistent 
        // 45-degree downward angle. This prevents massive, dark shadows from the shelves when the camera pulls far back!
        const currentAzimuth = controls.getAzimuthalAngle();
        dirLight.position.set(Math.sin(currentAzimuth) * 100, 100, Math.cos(currentAzimuth) * 100);

        pointLight1.color.lerp(tColor1, 0.03);
        neonTop.material.color.lerp(tColor1, 0.03);
        neonTop.material.emissive.lerp(tColor1, 0.03);

        pointLight2.color.lerp(tColor2, 0.03);
        neonBot.material.color.lerp(tColor2, 0.03);
        neonBot.material.emissive.lerp(tColor2, 0.03);

        // 2. Frame LED illumination fading
        if (activeCard) {
            // Cranked up to 5.0 to ensure they pop even against the new camera headlight
            localLed1.intensity += (5.0 - localLed1.intensity) * 0.1;
            localLed2.intensity += (5.0 - localLed2.intensity) * 0.1;
            
            // Tint the LED slightly towards the card's accent color, but keep a warm vintage yellow base
            const targetColor = new THREE.Color(0xffd580).lerp(new THREE.Color(activeCard.userData.accentColor), 0.15);
            ledMat.color.lerp(targetColor, 0.1);
            localLed1.color.lerp(targetColor, 0.1);
            localLed2.color.lerp(targetColor, 0.1);
        } else {
            localLed1.intensity += (0 - localLed1.intensity) * 0.1;
            localLed2.intensity += (0 - localLed2.intensity) * 0.1;
            ledMat.color.lerp(new THREE.Color(0x111111), 0.1);
        }

        cards.forEach(card => {
            const data = card.userData;
            // No physical movement, just a subtle surface glow when targeted
            const targetEmissive = (activeCard === card) ? 0.3 : 0; 
            card.material.emissiveIntensity += (targetEmissive - card.material.emissiveIntensity) * 0.1;
        });

        renderer.render(scene, camera);
    }

    animate();
</script>
</body>
